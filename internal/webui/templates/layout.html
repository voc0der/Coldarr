{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coldarr{{if .Title}} - {{.Title}}{{end}}</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<nav>
  <a class="brand" href="/"><img src="/static/icon-512.png" alt="" class="brand-icon">Coldarr</a>
  <a href="/">{{template "icon-dashboard"}} Dashboard</a>
  <a href="/plan">{{template "icon-plan"}} Plan</a>
  <a href="/tiers">{{template "icon-tiers"}} Tiers</a>
  <a href="/connections">{{template "icon-connections"}} Connections</a>
  <a href="/history">{{template "icon-history"}} History</a>
</nav>
<main>
{{block "content" .}}{{end}}
</main>
<script>
(function () {
  // Mark only the single best-matching nav link "current" - e.g. on
  // /history/verify/status, both /history and a plain prefix test would
  // match, so pick the longest (most specific) match instead of marking
  // multiple links at once. The brand link also points at "/" (same as
  // Dashboard) but isn't a page nav link, so it's excluded - otherwise it
  // ties with Dashboard and wins for being first in the DOM.
  var path = location.pathname;
  var best = null;
  document.querySelectorAll("nav a[href]:not(.brand)").forEach(function (a) {
    var href = a.getAttribute("href");
    var matches = href === "/" ? path === "/" : (path === href || path.startsWith(href + "/"));
    if (matches && (!best || href.length > best.getAttribute("href").length)) {
      best = a;
    }
  });
  if (best) best.setAttribute("aria-current", "page");
})();
</script>
</body>
</html>
{{end}}
