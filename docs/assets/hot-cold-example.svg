<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" width="640" height="246">
  <style>
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e1f23; stroke: #34353a; }
      .muted { fill: #9b9a94; }
      .icon { color: #9b9a94; }
      .label { fill: #ececea; }
      .caption { fill: #b5b4ae; }
      .track { fill: #5b8def; fill-opacity: 0.22; }
      .bar { fill: #5b8def; }
    }
  </style>
  <defs>
    <clipPath id="track1"><rect x="210" y="76" width="320" height="20" rx="10" ry="10"/></clipPath>
    <clipPath id="track2"><rect x="210" y="150" width="320" height="20" rx="10" ry="10"/></clipPath>
    <clipPath id="track3"><rect x="210" y="184" width="320" height="20" rx="10" ry="10"/></clipPath>
    <symbol id="drive-icon" viewBox="0 0 18 12">
      <rect x="1" y="1" width="16" height="10" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <line x1="1.8" y1="6" x2="16.2" y2="6" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="4" cy="8.3" r="1" fill="currentColor" stroke="none"/>
      <line x1="11" y1="8.3" x2="14.5" y2="8.3" stroke="currentColor" stroke-width="1.2"/>
    </symbol>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="639" height="245" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>

  <text x="32" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="1" class="muted" fill="#898781">A TYPICAL COLDARR LAYOUT</text>
  <text x="578" y="34" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" class="muted" fill="#898781">% DISK USED</text>

  <!-- Hot group -->
  <text x="32" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" class="muted" fill="#898781">HOT &#8212; RUNOFF, NOT A DIAL</text>

  <use href="#drive-icon" x="32" y="78" width="18" height="12" class="icon" color="#898781"/>
  <text x="58" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" class="label" fill="#0b0b0b">Primary NAS</text>
  <rect x="210" y="76" width="320" height="20" rx="10" ry="10" class="track" fill="#2a78d6" fill-opacity="0.16"/>
  <rect x="210" y="76" width="243.2" height="20" clip-path="url(#track1)" class="bar" fill="#2a78d6"/>
  <text x="546" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" class="label" fill="#0b0b0b">76%</text>

  <!-- Cold group -->
  <text x="32" y="138" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1" class="muted" fill="#898781">COLD &#8212; PACKED TOWARD TARGET</text>

  <use href="#drive-icon" x="32" y="152" width="18" height="12" class="icon" color="#898781"/>
  <text x="58" y="164" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" class="label" fill="#0b0b0b">Satellite &#8212; Movies</text>
  <rect x="210" y="150" width="320" height="20" rx="10" ry="10" class="track" fill="#2a78d6" fill-opacity="0.16"/>
  <rect x="210" y="150" width="316.8" height="20" clip-path="url(#track2)" class="bar" fill="#2a78d6"/>
  <text x="546" y="164" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" class="label" fill="#0b0b0b">99%</text>

  <use href="#drive-icon" x="32" y="186" width="18" height="12" class="icon" color="#898781"/>
  <text x="58" y="198" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" class="label" fill="#0b0b0b">Satellite &#8212; TV</text>
  <rect x="210" y="184" width="320" height="20" rx="10" ry="10" class="track" fill="#2a78d6" fill-opacity="0.16"/>
  <rect x="210" y="184" width="316.8" height="20" clip-path="url(#track3)" class="bar" fill="#2a78d6"/>
  <text x="546" y="198" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" class="label" fill="#0b0b0b">99%</text>

  <text x="32" y="228" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" class="caption" fill="#52514e">Coldarr packs cold storage full and lets hot storage sit at whatever's left &#8212; not the other way around.</text>
</svg>
