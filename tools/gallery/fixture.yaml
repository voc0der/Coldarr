# The gallery's fake world: the drives Coldarr's tiers sit on and the
# library Radarr/Sonarr/Jellyfin report. Edit freely - every screenshot is
# derived from this and tools/gallery/coldarr.yaml.
#
# Sizes: decimal units (GB, TB) for drives, since that's how drives are
# sold (a "16TB" drive shows up in Coldarr as 14901.2 GB, like a real one).
# Binary units (GiB) for media, since that's what Coldarr displays
# ("58.4GiB" shows as "58.4 GB").
#
# Every title is invented, so the screenshots show no real films or shows.

versions:
  radarr: 6.0.4.10291
  sonarr: 4.0.16.2944
  jellyfin: 10.11.11

# How long a fake move takes: size / move_throughput, clamped to
# [min, max] seconds - long enough to screenshot an apply mid-run.
simulation:
  move_throughput: 6GiB
  min_move_seconds: 3
  max_move_seconds: 10

# Each drive is its own FUSE mount. used_percent is what the drive reports
# once the library below is on it; the media listed here counts toward it.
drives:
  - name: nas
    mount: /data/media
    size: 40TB
    used_percent: 78.0
  - name: sat1
    mount: /mnt/sat1
    size: 16TB
    used_percent: 89.0
  - name: sat2
    mount: /mnt/sat2
    size: 14TB
    used_percent: 90.5
  - name: sat3
    mount: /mnt/sat3
    size: 12TB
    used_percent: 85.5

# Per item: title, year, root (the Radarr/Sonarr root folder it's in),
# size, added_days_ago; optionally profile (quality profile - SD and
# HD-720p are low-priority in coldarr.yaml), monitored, tags, status,
# favorite (Jellyfin), cutoff_unmet, downloading, and moved_days_ago
