name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Go and JavaScript
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      COLDARR_CODEQL_HOME: ${{ github.workspace }}/../.coldarr-codeql
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Ubuntu denies capabilities in unprivileged user namespaces, so bwrap
      # can't set up its network namespace. Ubuntu's profile allows bwrap itself
      # while the commands it starts still get no capabilities. Since 25.04 the
      # apparmor package ships it; loading it here fails loudly if it moves again.
      - name: Install sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap zstd
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-all --die-with-parent --ro-bind / / true

      - name: Test the scan harness
        run: python3 -m unittest discover -s dev/codeql -p 'test_*.py' -v

      - name: Prepare Go dependencies
        run: go mod download

      - name: Install the latest CodeQL bundle
        run: python3 dev/codeql/scan.py install

      # Unsuppressed findings fail, as do setup, extraction and analysis errors.
      # The harness prints counts, while detailed results remain on this runner.
      - name: Scan Go and JavaScript without network access
        run: python3 dev/codeql/scan.py scan --fail-on-findings

      - name: Remove private scan data
        if: always()
        run: rm -rf -- "$COLDARR_CODEQL_HOME"
