name: Container Scan

# Known vulnerabilities in the published image. The image stays the same after
# release while advisories keep arriving, so a finding here means a new release is
# due. Publishing applies the same check before pushing (release.yml).
on:
  schedule:
    - cron: '47 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Released image (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # For reviewed exceptions in a .grype.yaml, which Grype reads from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails on high or critical vulnerabilities that have a fix.
      - name: Scan the latest release
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_PLATFORM: linux/${{ matrix.arch }}
        with:
          image: registry:ghcr.io/voc0der/coldarr:latest
          severity-cutoff: high
          only-fixed: true
          output-format: table
